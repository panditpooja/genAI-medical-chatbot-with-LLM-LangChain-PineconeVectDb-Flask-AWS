name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: [main]

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # Checker: confirms correct AWS account/region + repo exists
      - name: Debug AWS identity + ECR repo exists
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -e
          echo "AWS_REGION=$AWS_REGION"
          aws sts get-caller-identity
          aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$ECR_REPOSITORY"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug runner (AWS/Docker)
        run: |
          set -x
          whoami
          docker --version
          docker info || true
          aws --version
          aws sts get-caller-identity || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPO }}
          TAG: latest
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$TAG"
          docker pull "$IMAGE"

      - name: Run Docker Image to serve users (safe redeploy)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPO }}
          TAG: latest
          CONTAINER_NAME: medical-chatbot
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$TAG"

          echo "Deploying $IMAGE as $CONTAINER_NAME"

          # Stop/remove existing container to avoid 8080 port conflicts
          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            docker rm -f "${CONTAINER_NAME}"
          fi

          # Run new container
          docker run -d --name "${CONTAINER_NAME}" --restart unless-stopped \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
            -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e OPENAI_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -p 8080:8080 \
            "$IMAGE"

          # Show status + logs (helps when container exits immediately)
          docker ps -a --filter "name=${CONTAINER_NAME}"
          docker logs --tail 120 "${CONTAINER_NAME}" || true
